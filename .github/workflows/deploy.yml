name: Build, Push & Deploy

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/enricco18/home-app-backend:latest

  front:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ghcr.io/enricco18/home-app-front:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://home-app.chimaera-climb.ts.net:8443
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, front]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no VPS
        uses: hostinger/deploy-action@v1
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: home-app
          docker-compose-path: ./compose.yaml
          environment-variables: |
            TS_AUTHKEY=${{ secrets.TS_AUTHKEY }}
            CLERK_ISSUER_URI=${{ secrets.CLERK_ISSUER_URI }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
