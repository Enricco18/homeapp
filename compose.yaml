services:
  tailscale:
    image: tailscale/tailscale
    cap_add:
      - NET_ADMIN
    volumes:
      - /dev/net/tun:/dev/net/tun
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=home-app
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json
    networks:
      - app-net
    restart: unless-stopped

  backend:
    image: ghcr.io/enricco18/home-app-backend:latest
    platform: linux/amd64
    network_mode: "service:tailscale"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CLERK_ISSUER_URI=${CLERK_ISSUER_URI}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=https://home-app.chimaera-climb.ts.net
    depends_on:
      tailscale:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: ghcr.io/enricco18/home-app-front:latest
    platform: linux/amd64
    network_mode: "service:tailscale"
    environment:
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      tailscale:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  app-net:

volumes:
  pgdata:
  tailscale-state:
